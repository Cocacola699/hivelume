function setNfy(p){Object.assign(NFY,p||{});S('nfy',NFY);pushPrefs()}
function pushPrefs(){S('nfy',NFY);clearTimeout(pushPrefs.t);pushPrefs.t=setTimeout(async()=>{if(!tok())return;let spec={dm:NFY.dm?1:0,men:NFY.men?1:0,ann:NFY.ann?1:0,evt:NFY.evt?1:0,dig:NFY.dig?1:0,off:NFY.off?1:0,dmwho:NFY.dmwho||'all',vis:NFY.vis||'full',mutech:NFY.mutech||{},reads:NFY.reads||{}};let r=await sbFetch('rpc/hive_prefs_set','POST',{pid:me,token:tok(),spec});if(!r||!r.ok){if(r&&r.error=='session')toast('Log in again to save this on your account');else if(r)toast(hiveErr(r));return}sbBeat.at=0;sbBeat()},500)}
async function pullPrefs(){if(!me||!tok())return;let r=await sbFetch('rpc/hive_prefs_get','POST',{pid:me,token:tok()});if(!r||!r.ok||!r.prefs)return;let s=r.prefs;if(s.dm==null&&s.dmwho==null&&s.vis==null&&s.off==null)return;NFY=Object.assign({dm:1,men:1,ann:1,evt:1,dig:0,off:0,dmwho:'all',vis:'full',mutech:{},reads:{}},s);if(typeof NFY.mutech!='object'||!NFY.mutech)NFY.mutech={};if(typeof NFY.reads!='object'||!NFY.reads)NFY.reads={};S('nfy',NFY);applyReads();if(nfy().off)setSt('Appearing offline','#f0b132')}
function applyReads(){let ch=0;Object.values(CH).forEach(c=>{let ts=+(NFY.reads&&NFY.reads[c.id]||0),last=(c.msgs||[]).filter(m=>m.by!=me).at(-1);if(ts&&last&&last.ts<=ts&&c.un){c.un=0;ch=1}});if(ch){save();updTitle();render()}}
function markRead(c){if(!c)return;let last=(c.msgs||[]).at(-1),ts=last?last.ts:Date.now();NFY.reads=NFY.reads||{};if((NFY.reads[c.id]||0)>=ts)return;NFY.reads[c.id]=ts;let keys=Object.keys(NFY.reads).sort((a,b)=>NFY.reads[b]-NFY.reads[a]).slice(0,40),o={};keys.forEach(k=>o[k]=NFY.reads[k]);NFY.reads=o;pushPrefs()}
function muteCh(id,ch,on){let c=CH[id];if(!c||!ch)return;NFY.mutech=NFY.mutech||{};let k=id+'/'+ch;if(on)delete NFY.mutech[k];else NFY.mutech[k]=1;setNfy({});toast(on?'Notifications on for #'+ch:'#'+ch+' muted')}
async function pullBlocks(){if(!tok())return;let r=await sbFetch('rpc/hive_blocks_mine','POST',{pid:me,token:tok()});if(!r||!r.ok||!Array.isArray(r.ids))return;if(!localStorage.getItem('blkup')){localStorage.setItem('blkup','1');for(const id of Object.keys(BLK).slice(0,30)){if(r.ids.indexOf(id)<0&&/^[\w-]{4,40}$/.test(id))await sbFetch('rpc/hive_block_set','POST',{pid:me,token:tok(),who:id,onn:1})}let again=await sbFetch('rpc/hive_blocks_mine','POST',{pid:me,token:tok()});if(again&&again.ok&&Array.isArray(again.ids))r=again}BLK={};r.ids.forEach(id=>{BLK[id]=1});S('blk',BLK)}

async function digest(){if(!NFY.dig||!me||!tok())return;let last=+localStorage.getItem('hvdig')||0;if(Date.now()-last<20*3600000)return;localStorage.setItem('hvdig',String(Date.now()));let r=await sbFetch('rpc/hive_pulse','POST',{pid:me,off:0});if(!r||!r.ok||!Array.isArray(r.items))return;let n=r.items.filter(x=>((x.k=='announce'||x.k=='update'||x.k=='feature')&&NFY.ann)||(x.k=='event'&&NFY.evt)).length;if(n)alertNote('digest','Hivelume',n+' hive update'+(n==1?'':'s'),'digest','/')}
function saveMsg(m,c){if(!m||!c)return;if(!tok())return toast('Log in again to save messages on your account');let body=String(m.text||(m.f&&m.f.n)||(m.gif?'GIF':'')||'').slice(0,500);if(SAV[m.id]){delete SAV[m.id];sbFetch('rpc/hive_save_set','POST',{pid:me,token:tok(),mid:m.id,chat:c.id,body:'',onn:0});toast('Removed from saved');return}if(!body)return toast('Nothing to save');SAV[m.id]={chat:c.id,body,ts:m.ts||Date.now()};sbFetch('rpc/hive_save_set','POST',{pid:me,token:tok(),mid:m.id,chat:c.id,body,onn:1}).then(r=>{if(!r||!r.ok)toast(hiveErr(r))});toast('Saved')}

async function modQ(){let c=cur;if(!c||!isCom(c))return;if(!tok())return toast('Log in again to open the moderation queue');let reps=await sbFetch('rpc/hive_reports_for','POST',{pid:me,token:tok(),rid:c.id}),apps=await sbFetch('rpc/hive_appeals_for','POST',{pid:me,token:tok(),rid:c.id});if((!reps||!reps.ok)&&(!apps||!apps.ok))return toast(hiveErr(reps||apps));let row=(x,kind)=>`<div class=ab style="text-align:left"><b>${esc(x.reason||'Appeal')}</b> <small>${esc(x.status||'')}</small><p>${esc(x.excerpt||x.note||'')}</p><p class=mu>${kind=='report'&&x.reporter?'From a member · ':''}about ${esc(x.target||x.by||'someone')}</p>${x.status=='open'?`<p><button type=button onclick="modDo('${kind}','${esc(x.id)}','kept')">Keep</button> <button class=g type=button onclick="modDo('${kind}','${esc(x.id)}','dismissed')">Dismiss</button></p>`:'<p class=mu>Decided. This does not ban anyone by itself.</p>'}</div>`;modal(`<h3>Moderation queue</h3><p class=mu>Staff decide. Guardian AI still only replaces a flagged message. It does not ban anyone. Reporters stay hidden from the person they reported.</p><h4>Reports</h4>${(reps&&reps.items||[]).map(x=>row(x,'report')).join('')||'<p class=mu>No reports.</p>'}<h4>Appeals</h4>${(apps&&apps.items||[]).map(x=>row(x,'appeal')).join('')||'<p class=mu>No appeals.</p>'}`)}

y hides your bio, status, pronouns and banner from other people. A new device receives that public version.</small></p><h4>Blocked people</h4><div id=blist></div><h4>This device</h4><p class=mu>One live connection per account. This browser is the active one. There is no separate device list, and messages are not end-to-end encrypted.</p><h4>Your data</h4><p class=mu><small>Messages you send, including direct messages, are checked by the existing Hivelume filter before delivery. Flagged text is replaced for everyone. The filter does not read old history and it does not ban you.</small></p><p><button type=button onclick=exportMe()>Download my data</button> <button class=r type=button onclick=deleteAsk()>Delete my account</button></p>`);let box=$('#blist');if(box){let ids=Object.keys(BLK);box.innerHTML=ids.length?ids.map(id=>`<div class=it><span class=nm>${esc((PR[id]&&PR[id].name)||id)}</span><button class=g type=button onclick="unblock('${esc(id)}')">Unblock</button></div>`).join(''):'<p class=mu>Nobody is blocked.</p>'}}
