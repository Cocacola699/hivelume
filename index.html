<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Hivelume</title>
<style>

#cl{position:fixed;inset:0;background:#000e;z-index:70;display:flex;flex-direction:column;color:#fff}#cg{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;padding:8px;overflow:auto}#cg>div{background:#222;border-radius:12px;position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}#cg video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}#cg b{position:absolute;left:8px;bottom:6px;z-index:1;text-shadow:0 0 4px #000}#cb{display:flex;gap:10px;justify-content:center;padding:14px}
@media(max-width:700px){#mo.dock{align-items:flex-end;justify-content:center}#mo.dock #box{width:100%;max-height:48dvh}}

 </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=boot;document.head.append(s)"></script>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),sz=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB';
const NEW=!L('prof',null);let P=L('prof',{name:'User'+(Math.random()*900+100|0),bio:'',color:['#f26b3a','#eb459e','#3ba55d','#f0b132','#ed4245','#00b0f4'][Math.random()*6|0],em:'',av:'',bn:''}),CFG=L('cfg',{ac:'#f26b3a',th:'dark',bg:'',fs:15,rad:12,cp:0}),CH=L('chats',{}),PR=L('peers',{}),me=L('pid',0)||'nx'+Math.random().toString(36).slice(2,10),peer,conns={},cur=null,rep=null,vi=0,vl=[],T,LOCK=0,CHN={},calls={},LS=null,SV='home',ST='Connecting…',STC='#f0b132';
if(CFG.ac=='#5865f2')CFG.ac='#f26b3a';
S('pid',me);

function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
const EM='😀 😃 😄 😁 😆 😅 🤣 😂 🙂 😉 😊 😇 🥰 😍 🤩 😘 😋 😛 😜 🤪 🤗 🤔 🤨 😐 🙄 😏 😴 😎 🤓 😢 😭 😤 😡 😱 😳 🥺 😬 🤯 🥳 😈 👻 💀 👽 🤖 💩 🙈 🙊 👍 👎 👌 ✌️ 🤞 🤟 🤘 👏 🙌 🙏 💪 👀 🧠 ❤️ 🧡 💛 💚 💙 💜 🖤 💔 🔥 ✨ ⭐ 🌟 💯 ✅ ❌ 🎉 🎊 🎁 🏆 🎮 🎵 🎶 ☕ 🍕 🍔 🍟 🍿 🍺 🎂 🌈 ☀️ 🌙 ⚡ ❄️ 🌊 🐶 🐱 🐼 🦊 🐸 🐵 🦄 🚀 💻 📱 📸 🎬'.split(' ');
/* ---------- helpers ---------- */

 avId=i=>AV(i==me?P:PR[i]||{name:i}),bnS=p=>p.bn?`background:url(${p.bn}) center/cover`:`background:linear-gradient(135deg,${p.color||'#f26b3a'},#000a)`,
 isAdm=(c,i)=>i==c.host||c.admins.includes(i),

 if(d.t=='hi'){PR[from]=d.p;S('peers',PR);Object.values(CH).forEach(c=>{if(c.type=='room'&&c.host==me&&c.members.includes(from))c.members.forEach(m=>m!=me&&m!=from&&send(m,{t:'prof',id:from,p:d.p}))});render()}
 else if(d.t=='mesh'){let c=CH[d.r];c&&meshEv(c,d.ev,from)}else if(d.t=='hist'){let c=CH[d.r];if(c&&c.members&&c.members.includes(from)){let n=0;(d.m||[]).forEach(m=>{if(!c.msgs.some(x=>x.id==m.id)){c.msgs.push(m);n++}});if(n){c.msgs.sort((a,b)=>a.ts-b.ts);save();render()}}}else if(d.t=='prof'){PR[d.id]=d.p;S('peers',PR);render()}

function saveP(){cap();if(!T.name.trim())T.name=P.name;P=T;LOCK=0;P.em=P.em||'';S('prof',P);Object.values(conns).forEach(c=>c.open&&c.send({t:'hi',p:P}));Object.values(CH).forEach(c=>c.type=='room'&&c.host==me&&c.members.forEach(m=>m!=me&&send(m,{t:'prof',id:me,p:P})));closeM();render()}
const BGS=['linear-gradient(135deg,#1d2b64,#f8cdda)','linear-gradient(135deg,#0f2027,#2c5364)','linear-gradient(135deg,#ee0979,#ff6a00)','linear-gradient(135deg,#134e5e,#71b280)','linear-gradient(135deg,#4b134f,#c94b4b)','linear-gradient(135deg,#000428,#004e92)','radial-gradient(circle at 20% 20%,#3a1c71,#000)','repeating-linear-gradient(45deg,#1b1b2f,#1b1b2f 12px,#222244 12px,#222244 24px)','#0b132b','#2d2a26','#102a1f','#f3e9d2'];
function setM(){$('#side').classList.remove('open');if(!cur&&CH[me])openChat(me);modal(`<h3>Customize <button class=g style="float:right" onclick=closeM()>✕ Close</button></h3><p class=mu>Changes show live behind this panel.</p><p>Theme <select onchange="cf('th',this.value)">${['dark','light','amoled'].map(t=>`<option ${CFG.th==t?'selected':''}>${t}</option>`).join('')}</select></p><p>Accent colour <input type=color value="${CFG.ac}" oninput="cf('ac',this.value)"></p><p>Font size <input type=range min=12 max=22 value=${CFG.fs} oninput="cf('fs',+this.value)"></p><p>Roundness <input type=range min=0 max=24 value=${CFG.rad} oninput="cf('rad',+this.value)"></p><p><label><input type=checkbox style="width:auto" ${CFG.cp?'checked':''} onchange="cf('cp',+this.checked)"> Compact messages</label></p><h4>Chat background</h4><div class=bgs>${BGS.map((b,i)=>`<div style="background:${b}" onclick="cf('bg',BGS[${i}])"></div>`).join('')}</div><p>Solid colour <input type=color value="#2b2725" oninput="cf('bg',this.value)"></p><p>Dim background <input type=range min=0 max=80 value=${CFG.dim||0} oninput="cf('dim',+this.value)"></p><p><button class=g onclick="pickImg(1280,720,d=>cf('bg','url('+d+') center/cover'))">Upload image</button> <button class=g onclick="cf('bg','')">Reset</button></p>`,1)}
function cf(k,v){CFG[k]=v;S('cfg',CFG);applyCfg()}
function applyCfg(){let s=document.documentElement.style,d=(CFG.dim||0)/100;s.setProperty('--ac',CFG.ac);s.setProperty('--fs',CFG.fs+'px');s.setProperty('--rad',CFG.rad+'px');document.body.className=CFG.th+(CFG.cp?' cp':'');$('#msgs').style.background=CFG.bg?(d?`linear-gradient(rgba(0,0,0,${d}),rgba(0,0,0,${d})),`:'')+CFG.bg:''}
/* ---------- media viewer ---------- */
function view(id){vl=cur.msgs.filter(m=>m.f&&m.f.u&&/^(image|video)\//.test(m.f.ty));vi=vl.findIndex(m=>m.id==id);lb()}
function lb(){let m=vl[vi];if(!m)return lbx();let f=m.f,u=U(f),v=/^video/.test(f.ty);$('#lb').hidden=false;
 $('#lb').innerHTML=`<div class=lt><span>${esc(f.n)} (${vi+1}/${vl.length})</span><a class=dl style="color:#fff" href="${u}" download="${esc(f.n)}">⬇ Save</a><button class=g onclick=lbx()>✕</button></div><div class=ls>${vl.length>1?'<b class=nv style=left:4px onclick=lbn(-1)>‹</b><b class=nv style=right:4px onclick=lbn(1)>›</b>':''}${v?`<video id=vv src="${u}" autoplay playsinline></video>`:`<img id=pic src="${u}">`}</div>`+(v?`<div class=vc><button id=pp>⏸</button><input type=range id=sk min=0 max=1000 value=0><small id=tm>0:00</small><button class=g id=mu2>🔊</button><input type=range id=vo min=0 max=1 step=.05 value=1 style=width:70px><button class=g id=sp>1×</button><button class=g id=fsb>⛶</button></div>`:'<div class=vc><small>Click to zoom · scroll wheel or pinch</small></div>');
 if(v){let e=$('#vv'),t=s=>(s/60|0)+':'+('0'+(s%60|0)).slice(-2),sp=[1,1.5,2,.5],si=0;$('#pp').onclick=()=>e.paused?e.play():e.pause();e.onclick=$('#pp').onclick;e.onplay=()=>$('#pp').textContent='⏸';e.onpause=()=>$('#pp').textContent='▶';e.ontimeupdate=()=>{$('#sk').value=e.duration?e.currentTime/e.duration*1000:0;$('#tm').textContent=t(e.currentTime)+'/'+t(e.duration||0)};$('#sk').oninput=function(){e.currentTime=this.value/1000*e.duration};$('#vo').oninput=function(){e.volume=this.value};$('#mu2').onclick=()=>{e.muted=!e.muted;$('#mu2').textContent=e.muted?'🔇':'🔊'};$('#sp').onclick=()=>{si=(si+1)%4;e.playbackRate=sp[si];$('#sp').textContent=sp[si]+'×'};$('#fsb').onclick=()=>e.requestFullscreen&&e.requestFullscreen()}
 else{let i=$('#pic'),z=1,set=()=>i.style.transform='scale('+z+')';i.onclick=()=>{z=z>1?1:2.5;set()};i.onwheel=ev=>{ev.preventDefault();z=Math.min(6,Math.max(1,z-ev.deltaY/300));set()}}}
function lbn(d){vi=(vi+d+vl.length)%vl.length;lb()}
function lbx(){let v=$('#vv');v&&v.pause();$('#lb').hidden=true;$('#lb').innerHTML=''}
/* ---------- files survive reloads (IndexedDB) ---------- */
const idbReq=new Promise(r=>{try{let q=indexedDB.open('hive',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idb(op,k,v){let d=await idbReq;if(!d)return;return new Promise(r=>{try{let s=d.transaction('f',op=='get'?'readonly':'readwrite').objectStore('f'),q=op=='put'?s.put(v,k):op=='del'?s.delete(k):s.get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}})}
async function restore(){for(const c of Object.values(CH))for(const m of c.msgs)if(m.f&&!m.f.u){let b=await idb('get',m.id);if(b)attach(m.f,b)}render()}
/* ---------- voice & video calls (1:1 in DMs, mesh in groups) ---------- */
async function media(v){if(LS)return LS;try{LS=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v})}catch(e){try{LS=await navigator.mediaDevices.getUserMedia({audio:true});toast('Camera unavailable - audio only')}catch(x){toast('Allow microphone/camera access (needs https or a local file)');return null}}return LS}
function tile(id,stream,self){let t=document.getElementById('t'+id);if(!t){t=document.createElement('div');t.id='t'+id;t.innerHTML=`<video autoplay playsinline ${self?'muted':''}></video><span>${AV(self?P:PR[id]||{name:id})}</span><b>${esc(self?'You':PR[id]?.name||id)}</b>`;$('#cg').append(t)}let v=t.querySelector('video');if(v.srcObject!==stream)v.srcObject=stream;v.hidden=!stream.getVideoTracks().length}
function callUI(){$('#cl').hidden=false;$('#cl').innerHTML='<div id=cg></div><div id=cb><button class=g id=cm>🎤 Mute</button><button class=g id=cv>📷 Camera</button><button class=r id=ce>Hang up</button></div>';$('#cm').onclick=()=>{let t=LS.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('#cm').textContent=t.enabled?'🎤 Mute':'🔇 Unmute'}};$('#cv').onclick=()=>{let t=LS.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('#cv').textContent=t.enabled?'📷 Camera':'🚫 Camera off'}};$('#ce').onclick=endCall;tile(me,LS,1)}
async function startCall(v){let c=cur;if(!c||c.id==me)return toast('Open a chat with someone first');if(!peer||!peer.open)return toast('Not connected yet');let ids=c.type=='dm'?[c.id]:c.members.filter(m=>m!=me);if(!await media(v))return;callUI();ids.forEach(id=>dial(id,v,c.id))}
function dial(id,v,r){if(calls[id]||!LS)return;hook(peer.call(id,LS,{metadata:{v:v?1:0,r,from:P.name}}))}
function hook(cl){calls[cl.peer]=cl;cl.on('stream',s=>{if($('#cg'))tile(cl.peer,s)});cl.on('close',()=>{if(calls[cl.peer]==cl)delete calls[cl.peer];let t=document.getElementById('t'+cl.peer);t&&t.remove()});cl.on('error',()=>{delete calls[cl.peer]})}
function endCall(){Object.values(calls).forEach(c=>c.close());calls={};LS&&LS.getTracks().forEach(t=>t.stop());LS=null;$('#cl').hidden=true;$('#cl').innerHTML=''}
async function onCall(cl){let m=cl.metadata||{};if(LS){cl.answer(LS);hook(cl);return}if(!await ask((m.from||cl.peer)+' is calling you ('+(m.v?'video':'voice')+'). Answer?'))return cl.close();media(m.v).then(s=>{if(!s)return cl.close();callUI();cl.answer(s);hook(cl);let r=CH[m.r];if(r&&r.type=='room')r.members.forEach(x=>x!=me&&x!=cl.peer&&dial(x,m.v,m.r))})}
/* ---------- input wiring ---------- */
$('#in').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();sendText()}};
$('#in').oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'};
$('#in').onpaste=e=>{let f=e.clipboardData.files;if(f.length){e.preventDefault();sendFiles(f)}};
$('#fi').onchange=function(){sendFiles([...this.files]);this.value=''};
$('#main').ondragover=e=>e.preventDefault();$('#main').ondrop=e=>{e.preventDefault();sendFiles([...e.dataTransfer.files])};
document.onkeydown=e=>{if($('#lb').hidden)return;if(e.key=='Escape')lbx();if(e.key=='ArrowLeft')lbn(-1);if(e.key=='ArrowRight')lbn(1)};
applyCfg();P.em=P.em||'';P.bio=P.bio||'';P.av=P.av||'';P.bn=P.bn||'';PR.hive={name:'Hivelume',color:'#f26b3a',em:'⬡'};
if(!CH[me])CH[me]={id:me,type:'dm',msgs:[{id:uid(),by:'hive',ts:Date.now(),text:'Welcome to Hivelume ⬡\nThis is your private notes chat. Try emojis, polls 📊, files ＋ and ⚙ Customize (themes + chat backgrounds) right here.\nShare your ID (📋) with a friend to start a real DM, or create a group / community with ＋ on the left.'}]};
openChat(me);restore();typeof Peer=='undefined'?toast('Loading PeerJS…'):boot();if(NEW)editP(0,1);
</script></body></html>
